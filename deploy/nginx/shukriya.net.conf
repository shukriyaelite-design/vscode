server {
    listen 443 ssl http2;
    server_name shukriya.net www.shukriya.net;

    root /var/www/shukriya/dist;
    index index.html;

    # The Python API runs privately on the cloud server.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 14m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configure the certificate paths through the cloud server's SSL manager.
    # ssl_certificate /etc/letsencrypt/live/shukriya.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shukriya.net/privkey.pem;
}

server {
    listen 80;
    server_name shukriya.net www.shukriya.net;
    return 301 https://$host$request_uri;
}
